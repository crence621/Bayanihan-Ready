  <section class="screen" data-screen="location">
    <div class="dev-tag">Location</div>

    <div class="card">
      <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2" width="3" height="10"/><rect x="15" y="0" width="3" height="12"/></svg>
          <svg width="15" height="12" viewBox="0 0 15 12"><path d="M7.5 12 0 4.5C4 .5 11 .5 15 4.5Z"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0" y="0" width="21" height="12" rx="2.5" fill="none" stroke="currentColor"/><rect x="1.5" y="1.5" width="16" height="9" rx="1"/><rect x="22" y="4" width="2" height="4" rx="1"/></svg>
        </span>
      </div>

      <img class="card-map" src="!assets/!images/manila-map.jpg" alt="" aria-hidden="true">

      <div class="location-body">
        <div class="pin">
          <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="16" r="8" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="16" r="3" stroke="currentColor" stroke-width="2"/><path d="M20 24v10" stroke="currentColor" stroke-width="2" stroke-dasharray="1 3"/></svg>
        </div>
        <div class="location-text">
          <h1>Add Your Real Time Location<span class="dot">.</span></h1>
          <p class="sub">Please allow location permission.</p>
        </div>
      </div>

      <p class="coords" id="coords-readout" hidden></p>
      <p class="form-error" id="location-error" hidden></p>

      <div class="location-actions">
        <button class="btn-primary" id="allow-location">Allow</button>
        <button class="btn-text" data-goto="home">Skip for now</button>
      </div>
    </div>
  </section>
