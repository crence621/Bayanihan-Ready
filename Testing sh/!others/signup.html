  <section class="screen" data-screen="signup">
    <div class="dev-tag">Sign up <span>2</span></div>

    <div class="card">
      <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2" width="3" height="10"/><rect x="15" y="0" width="3" height="12"/></svg>
          <svg width="15" height="12" viewBox="0 0 15 12"><path d="M7.5 12 0 4.5C4 .5 11 .5 15 4.5Z"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0" y="0" width="21" height="12" rx="2.5" fill="none" stroke="currentColor"/><rect x="1.5" y="1.5" width="16" height="9" rx="1"/><rect x="22" y="4" width="2" height="4" rx="1"/></svg>
        </span>
      </div>

      <img class="card-map" src="!assets/!images/manila-map.jpg" alt="" aria-hidden="true">

      <form class="auth-form" id="signup-form" novalidate>
        <h1>Let's sign you up<span class="dot">.</span></h1>
        <p class="sub">Welcome.</p>

        <label class="field">
          <span>Full Name</span>
          <span class="input-wrap">
            <input type="text" name="name" placeholder="Your name" autocomplete="name" required>
          </span>
        </label>

        <label class="field">
          <span>Email</span>
          <span class="input-wrap">
            <svg class="input-icon" viewBox="0 0 20 16" fill="none"><path d="M2 2h16v12H2z" stroke="currentColor" stroke-width="1.4"/><path d="m2 3 8 6 8-6" stroke="currentColor" stroke-width="1.4"/></svg>
            <input type="email" name="email" placeholder="Your email" autocomplete="email" required>
          </span>
        </label>

        <label class="field">
          <span>Password</span>
          <span class="input-wrap">
            <svg class="input-icon" viewBox="0 0 18 18" fill="none"><rect x="3" y="8" width="12" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M6 8V5.5a3 3 0 0 1 6 0V8" stroke="currentColor" stroke-width="1.4"/></svg>
            <input type="password" name="password" placeholder="Enter password" autocomplete="new-password" minlength="8" required>
          </span>
        </label>

        <p class="form-error" id="signup-error" hidden></p>

        <button type="submit" class="btn-primary">Sign up</button>

        <p class="switch">Already a member? <a href="#" data-goto="login">Log in</a></p>
      </form>
    </div>
  </section>
