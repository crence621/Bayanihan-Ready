<!--
  !sos.html
  Setup SOS screen, cut from index.html.
  Originally <section data-screen="setup-sos">.
  Styles: !sos.css (range slider, toggle switch, settings-* layout rules).
  Note: the settings-* classes are shared with !account.html and the
  Settings screen still in index.html -- you'll want !sos.css loaded
  wherever those screens render too, or copy the rules back.
  Also uses the shared "Select Location" bottom sheet, which stayed
  in index.html since it's shared with !community-emergency.html.
  Depends on: !style.css, !api.js, !app.js
-->


  <!-- SCREEN 10 — SETUP SOS -->
  <section class="screen" data-screen="setup-sos">
    <div class="dev-tag">Setup SOS</div>

    <div class="card">
      <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2" width="3" height="10"/><rect x="15" y="0" width="3" height="12"/></svg>
          <svg width="15" height="12" viewBox="0 0 15 12"><path d="M7.5 12 0 4.5C4 .5 11 .5 15 4.5Z"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0" y="0" width="21" height="12" rx="2.5" fill="none" stroke="currentColor"/><rect x="1.5" y="1.5" width="16" height="9" rx="1"/><rect x="22" y="4" width="2" height="4" rx="1"/></svg>
        </span>
      </div>

      <div class="report-header">
        <button class="back-btn" data-goto="home" aria-label="Back">←</button>
        <h2>Setup SOS</h2>
      </div>

      <div class="settings-body">
        <div class="range-block">
          <div class="range-track-wrap">
            <div class="range-bubble" id="sos-range-bubble">30 km</div>
            <input type="range" class="range-input" id="sos-range" min="0" max="100" value="30">
          </div>
          <div class="range-labels"><span>0 km</span><span>100 km</span></div>
        </div>

        <div class="location-card-box">
          <div class="loc-text">
            <img src="!assets/!buttons/Pin.png" class="loc-icon-img" alt="Location Pin">
            <span id="sos-loc-text">6767, Buenavista-Lawaan Rd., Balangiga, Eastern Samar</span>
          </div>
          <button class="change-link" type="button" id="btn-sos-change-location">Change</button>
        </div>

        <div class="mini-map">
          <img class="mini-map-img" src="!assets/!images/samar-map.png" alt="Map of Balangiga, Eastern Samar">
          <span class="mini-map-you-here">You are here</span>
          <button class="track-location-pill" type="button" id="sos-track-location-btn">
            <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/><path d="M8 0v2.5M8 13.5V16M0 8h2.5M13.5 8H16" stroke="currentColor" stroke-width="1.4"/></svg>
            Track my location
          </button>
        </div>

        <div class="toggle-row">
          <span>Send Current Location</span>
          <label class="switch">
            <input type="checkbox" id="sos-send-location" checked>
            <span class="switch-slider"></span>
          </label>
        </div>

        <p class="section-title">Select Contact</p>
        <div class="location-card-box">
          <div class="loc-text"><span id="sos-contact-name">Mark Zimmermann</span></div>
          <button class="change-link" type="button" id="btn-sos-change-contact">Change</button>
        </div>
      </div>

      <div class="settings-actions">
        <button type="button" class="btn-outline" data-goto="home">Cancel</button>
        <button type="button" class="btn-primary-red" id="sos-save-btn">Save</button>
      </div>
    </div>
  </section>
