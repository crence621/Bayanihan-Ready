<!--
  !community-emergency.html
  "Report Emergency" screen, cut from index.html.
  Originally <section data-screen="report-emergency">, including the
  success modal that appears after submitting a report.
  Styles: !community-emergency.css (type-grid, proof-grid, location-card-box,
  input-card-box, btn-primary-red, success-modal rules).
  Also uses the shared "Select Location" bottom sheet, which stayed in
  index.html since it's shared with !sos.html.
  Depends on: !style.css, !api.js, !app.js
-->


  <!-- SCREEN 6 — REPORT EMERGENCY -->
  <section class="screen" data-screen="report-emergency">
    <div class="dev-tag">Report Emergency</div>

    <div class="card">
      <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2" width="3" height="10"/><rect x="15" y="0" width="3" height="12"/></svg>
          <svg width="15" height="12" viewBox="0 0 15 12"><path d="M7.5 12 0 4.5C4 .5 11 .5 15 4.5Z"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0" y="0" width="21" height="12" rx="2.5" fill="none" stroke="currentColor"/><rect x="1.5" y="1.5" width="16" height="9" rx="1"/><rect x="22" y="4" width="2" height="4" rx="1"/></svg>
        </span>
      </div>

      <div class="report-header">
        <button class="back-btn" data-goto="home" aria-label="Back">←</button>
        <h2>Report Emergency</h2>
      </div>

      <div class="report-body">
        <!-- EMERGENCY TYPES GRID -->
        <p class="section-title">Select Emergency type</p>
        <div class="type-grid">
          <button class="type-card is-selected" type="button" data-type="Flood">
            <span class="type-icon-wrapper"><img src="!assets/!buttons/Flood.png" alt="Flood"></span>
            <span>Flood</span>
          </button>
          <button class="type-card" type="button" data-type="Fire">
            <span class="type-icon-wrapper"><img src="!assets/!buttons/Fire.png" alt="Fire"></span>
            <span>Fire</span>
          </button>
          <button class="type-card" type="button" data-type="Medical">
            <span class="type-icon-wrapper"><img src="!assets/!buttons/Medical.png" alt="Medical"></span>
            <span>Medical</span>
          </button>
          <button class="type-card" type="button" data-type="Accident">
            <span class="type-icon-wrapper"><img src="!assets/!buttons/Accident.png" alt="Accident"></span>
            <span>Accident</span>
          </button>
          <button class="type-card" type="button" data-type="Quake">
            <span class="type-icon-wrapper"><img src="!assets/!buttons/Quake.png" alt="Quake"></span>
            <span>Quake</span>
          </button>
          <button class="type-card" type="button" data-type="Robbery">
            <span class="type-icon-wrapper"><img src="!assets/!buttons/Robbery.png" alt="Robbery"></span>
            <span>Robbery</span>
          </button>
          <button class="type-card" type="button" data-type="Assault">
            <span class="type-icon-wrapper"><img src="!assets/!buttons/Assault.png" alt="Assault"></span>
            <span>Assault</span>
          </button>
          <button class="type-card" type="button" data-type="Other">
            <span class="type-icon-wrapper"><img src="!assets/!buttons/Other.png" alt="Other"></span>
            <span>Other</span>
          </button>
        </div>

        <!-- LOCATION WITH ICON -->
        <p class="section-title">Location</p>
        <div class="location-card-box">
          <div class="loc-text">
            <img src="!assets/!buttons/Pin.png" class="loc-icon-img" alt="Location Pin">
            <span id="report-loc-text">6767, Buenavista-Lawaan Rd., Balangiga, Eastern Samar</span>
          </div>
          <button class="change-link" type="button" id="btn-change-location">Change</button>
        </div>

        <!-- PROOF BUTTONS WITH ICONS -->
        <p class="section-title">Attach proof</p>
        <div class="proof-grid">
          <button class="proof-btn" id="btn-proof-photo" type="button">
            <img src="!assets/!buttons/Camera.png" alt="Camera">
            <span>Click<br>Pictures</span>
          </button>
          <button class="proof-btn" id="btn-proof-video" type="button">
            <img src="!assets/!buttons/Vid.png" alt="Video">
            <span>Video<br>Recording</span>
          </button>
          <button class="proof-btn" id="btn-proof-audio" type="button">
            <img src="!assets/!buttons/Mic.png" alt="Voice">
            <span>Voice<br>Recording</span>
          </button>
        </div>
        <input type="file" id="proof-file-input" accept="image/*,video/*,audio/*" style="display:none">
        <div id="proof-preview-container" class="proof-preview-container"></div>

        <!-- BRIEF NOTES -->
        <div class="input-card-box" style="margin-top: 4px;">
          <input type="text" id="report-notes" placeholder="Specify emergency in brief...">
        </div>

        <button type="button" class="btn-primary-red" id="btn-submit-report">Submit Report</button>
      </div>

      <!-- SUCCESS MODAL -->
      <div class="modal-overlay" id="success-overlay">
        <div class="success-modal">
          <button class="success-close" id="success-close" aria-label="Close">✕</button>
          <img class="success-check" src="!assets/!images/Group_94.png" alt="">
          <h3>Help is on the way.</h3>
          <p>Read the tips to avoid any further risks.</p>
          <button type="button" class="btn-primary-red" id="read-instructions-btn">Read Instructions</button>
        </div>
      </div>
    </div>
  </section>
