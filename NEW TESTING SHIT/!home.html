<!--
  !home.html
  Home screen (with its tab bar) + Notifications screen, cut from index.html.
  Originally <section data-screen="home"> and <section data-screen="notifications">.
  The Maps and Guide tabs that used to live inside this screen were pulled out
  into !maps.html and !guide.html -- placeholder comments mark where they went.
  The Emergencies and Profile tabs stayed in place below (not requested to split).
  Styles: !home.css (home-card, sos-btn, tab-bar, notif-* rules)
  Depends on: !style.css, !api.js, !app.js
-->


  <!-- SCREEN 5 — HOME -->
  <section class="screen" data-screen="home">
    <div class="dev-tag">Home</div>

    <div class="card home-card">
      <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2" width="3" height="10"/><rect x="15" y="0" width="3" height="12"/></svg>
          <svg width="15" height="12" viewBox="0 0 15 12"><path d="M7.5 12 0 4.5C4 .5 11 .5 15 4.5Z"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0" y="0" width="21" height="12" rx="2.5" fill="none" stroke="currentColor"/><rect x="1.5" y="1.5" width="16" height="9" rx="1"/><rect x="22" y="4" width="2" height="4" rx="1"/></svg>
        </span>
      </div>

      <div class="home-top">
        <div>
          <p class="eyebrow">Stay safe!</p>
          <h2 id="home-username">Juan Gonzales</h2>
        </div>
        <button class="bell-btn" id="bell-btn" aria-label="Notifications">
          <svg viewBox="0 0 22 24" fill="none"><path d="M4 18v-6a7 7 0 0 1 14 0v6l2 2H2l2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 21a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.6"/></svg>
          <span class="bell-dot"></span>
        </button>
      </div>

      <!-- HOME TAB -->
      <div class="tab-panel is-active" data-tab="home">
        <div class="map-panel">
          <img class="card-map full" src="!assets/!images/manila-map.jpg" alt="" aria-hidden="true">
          <p class="help-copy">Help is just a click away!<br>Click <b>SOS button</b> to call the help.</p>
          <p class="coords" id="home-coords" hidden></p>

          <button class="sos-btn" id="sos-btn" data-goto="report-emergency">
            <span class="ring r1"></span>
            <span class="ring r2"></span>
            <span class="sos-core">SOS</span>
          </button>
        </div>
      </div>

      <!-- EMERGENCIES TAB -->
      <div class="tab-panel" data-tab="emergencies">
        <div class="panel-inner">
          <h3>Your Reports</h3>
          <ul class="responder-list" id="incident-list">
            <li class="empty">No reports yet. Reports you send from the SOS button will show up here.</li>
          </ul>
        </div>
      </div>

      <!-- MAPS TAB: moved to !maps.html -->

      <!-- GUIDE TAB: moved to !guide.html -->

      <!-- PROFILE TAB -->
      <div class="tab-panel" data-tab="profile">
        <div class="panel-inner profile-panel">
          <h3 class="profile-title">Profile</h3>

          <nav class="menu-list">
            <button class="menu-row" type="button" data-goto="account-details">
              <span>Account Details</span>
              <svg class="chev" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="menu-row" type="button" data-goto="setup-sos">
              <span>Setup SOS</span>
              <svg class="chev" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="menu-row" type="button" data-goto="settings">
              <span>Settings</span>
              <svg class="chev" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="menu-row" type="button" data-goto="settings">
              <span>Settings / About</span>
              <svg class="chev" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </nav>

          <button class="btn-outline-red btn-logout" id="logout-btn" type="button">Logout</button>
        </div>
      </div>

      <nav class="tab-bar">
        <button class="tab-item is-active" data-tab-goto="home">
          <svg viewBox="0 0 22 20" fill="none"><path d="M2 9 11 2l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H3a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span>Home</span>
        </button>
        <button class="tab-item" data-tab-goto="emergencies">
          <svg viewBox="0 0 22 20" fill="none"><path d="M11 1 1 18h20L11 1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 8v4" stroke="currentColor" stroke-width="1.6"/><circle cx="11" cy="15" r="1" fill="currentColor"/></svg>
          <span>Emergencies</span>
        </button>
        <button class="tab-item" data-tab-goto="maps">
          <svg viewBox="0 0 22 20" fill="none"><path d="M8 2 1 4v14l7-2 6 2 7-2V2l-7 2-6-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 2v14M14 4v14" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Maps</span>
        </button>
        <button class="tab-item" data-tab-goto="guide">
          <svg viewBox="0 0 20 20" fill="none"><path d="M2 3h7v15H2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M18 3h-7v15h7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span>Guide</span>
        </button>
        <button class="tab-item" data-tab-goto="profile">
          <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M2 18c1.5-4 5-6 8-6s6.5 2 8 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Profile</span>
        </button>
      </nav>
    </div>
  </section>


  <!-- SCREEN 8 — NOTIFICATIONS -->
  <section class="screen" data-screen="notifications">
    <div class="dev-tag">Notifications</div>

    <div class="card">
      <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2" width="3" height="10"/><rect x="15" y="0" width="3" height="12"/></svg>
          <svg width="15" height="12" viewBox="0 0 15 12"><path d="M7.5 12 0 4.5C4 .5 11 .5 15 4.5Z"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0" y="0" width="21" height="12" rx="2.5" fill="none" stroke="currentColor"/><rect x="1.5" y="1.5" width="16" height="9" rx="1"/><rect x="22" y="4" width="2" height="4" rx="1"/></svg>
        </span>
      </div>

      <div class="report-header">
        <button class="back-btn" data-goto="home" aria-label="Back">←</button>
        <h2>Notifications</h2>
      </div>

      <div class="notif-body" id="notif-list"></div>
    </div>
  </section>
